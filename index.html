<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameWebStudio — Разработка и услуги</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0e17; color: #fff; padding: 20px; min-height: 100vh; background-image: radial-gradient(circle at 20% 30%, rgba(0,150,255,0.15) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(0,100,255,0.1) 0%, transparent 50%); }
        .container { max-width: 1100px; margin: 0 auto; animation: fadeIn 1s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .header { text-align: center; margin-bottom: 50px; position: relative; }
        .admin-btn { position: absolute; top: 0; right: 0; background: rgba(20, 30, 50, 0.7); border: 1px solid rgba(0, 150, 255, 0.3); color: #4db8ff; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; transition: 0.3s; }
        .admin-btn:hover { background: rgba(0, 150, 255, 0.2); box-shadow: 0 0 15px rgba(0, 150, 255, 0.5); }
        .logo-img { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 30px rgba(0, 150, 255, 0.6); margin-bottom: 20px; animation: pulse 3s infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 30px rgba(0,150,255,0.6); } 50% { box-shadow: 0 0 45px rgba(0,180,255,0.9); } }
        h1 { font-size: 2.8rem; font-weight: 800; background: linear-gradient(90deg, #fff, #4db8ff, #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .subtitle { color: #8fa8c8; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 35px; }
        
        .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-bottom: 60px; }
        .link-card { display: flex; flex-direction: column; align-items: center; padding: 22px 15px; background: rgba(20, 30, 50, 0.7); border: 1px solid rgba(0, 150, 255, 0.3); border-radius: 14px; text-decoration: none; color: #fff; transition: 0.3s; }
        .link-card:hover { border-color: #00b4ff; transform: translateY(-5px); box-shadow: 0 0 25px rgba(0, 150, 255, 0.5); }
        .link-icon { font-size: 2rem; margin-bottom: 10px; }
        .link-title { font-size: 1.05rem; font-weight: 600; }
        
        .section-title { font-size: 1.8rem; text-align: center; margin-bottom: 30px; }
        .section-title span { color: #4db8ff; }
        
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 60px; }
        .product-card { background: rgba(20, 30, 50, 0.7); border: 1px solid rgba(0, 150, 255, 0.25); border-radius: 16px; padding: 25px 20px; cursor: pointer; position: relative; transition: 0.3s; }
        .product-card:hover { border-color: #00b4ff; transform: translateY(-5px); }
        .product-card.selected { border-color: #00b4ff; background: rgba(0, 120, 220, 0.2); box-shadow: 0 0 30px rgba(0, 150, 255, 0.6); }
        .product-card.selected::after { content: '✓'; position: absolute; top: 12px; right: 15px; color: #00d4ff; font-size: 1.4rem; font-weight: bold; }
        .product-icon { font-size: 2.2rem; margin-bottom: 12px; }
        .product-name { font-size: 1.15rem; font-weight: 600; margin-bottom: 8px; }
        .product-price { font-size: 1.3rem; color: #4db8ff; font-weight: 700; }
        .product-desc { font-size: 0.85rem; color: #8fa8c8; margin-top: 8px; }
        
        .custom-input-wrap { display: none; margin-top: 15px; }
        .custom-input-wrap.active { display: block; }
        .custom-input-wrap label { display: block; font-size: 0.85rem; color: #8fa8c8; margin-bottom: 6px; }
        .custom-input-wrap textarea { width: 100%; padding: 12px; background: rgba(10, 15, 25, 0.9); border: 1px solid rgba(0, 150, 255, 0.4); border-radius: 10px; color: #fff; font-family: inherit; font-size: 0.95rem; resize: vertical; min-height: 70px; outline: none; }
        .custom-input-wrap textarea:focus { border-color: #00b4ff; box-shadow: 0 0 15px rgba(0, 150, 255, 0.3); }
        
        .btn { display: block; margin: 0 auto; padding: 15px 45px; font-size: 1.05rem; font-weight: 700; color: #fff; background: linear-gradient(90deg, #0078dc, #00b4ff); border: none; border-radius: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 5px 20px rgba(0, 150, 255, 0.4); transition: 0.3s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0, 180, 255, 0.7); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-small { padding: 10px 18px; font-size: 0.85rem; margin: 0; text-transform: none; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
        .modal-overlay.active { display: flex; }
        .modal { background: linear-gradient(145deg, #0f1624, #0a1020); border: 1px solid rgba(0, 150, 255, 0.4); border-radius: 18px; padding: 30px 25px; max-width: 480px; width: 100%; box-shadow: 0 0 60px rgba(0, 150, 255, 0.4); position: relative; max-height: 90vh; overflow-y: auto; animation: modalIn 0.3s; }
        .modal.wide { max-width: 600px; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .modal h2 { font-size: 1.5rem; margin-bottom: 20px; text-align: center; color: #4db8ff; text-shadow: 0 0 20px rgba(0, 150, 255, 0.5); }
        .modal-close { position: absolute; top: 15px; right: 15px; background: rgba(0, 150, 255, 0.15); border: 1px solid rgba(0, 150, 255, 0.3); color: #4db8ff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; transition: 0.3s; }
        .modal-close:hover { background: rgba(0, 180, 255, 0.3); transform: rotate(90deg); }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; color: #8fa8c8; margin-bottom: 6px; }
        .form-group label .required { color: #ff5577; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px 14px; background: rgba(10, 15, 25, 0.9); border: 1px solid rgba(0, 150, 255, 0.4); border-radius: 10px; color: #fff; font-family: inherit; font-size: 1rem; outline: none; transition: 0.3s; }
        .form-group input:focus, .form-group textarea:focus { border-color: #00b4ff; box-shadow: 0 0 15px rgba(0, 150, 255, 0.3); }
        .form-hint { font-size: 0.75rem; color: #6a8099; margin-top: 5px; }
        
        .order-summary { background: rgba(0, 120, 220, 0.12); border: 1px solid rgba(0, 150, 255, 0.3); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .order-summary .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
        .order-summary .label { color: #8fa8c8; }
        .order-summary .value { color: #fff; font-weight: 600; text-align: right; }
        .order-summary .value.price { color: #4db8ff; font-size: 1.1rem; }
        .custom-note { background: rgba(255, 180, 0, 0.1); border-left: 3px solid #ffb400; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; color: #ffd166; margin-bottom: 20px; word-break: break-word; }
        
        .modal-buttons { display: flex; gap: 12px; margin-top: 10px; }
        .modal-buttons .btn { flex: 1; margin: 0; padding: 13px 20px; font-size: 0.95rem; }
        .btn-cancel { background: transparent; border: 1px solid rgba(0, 150, 255, 0.4); color: #8fa8c8; box-shadow: none; }
        .btn-cancel:hover { background: rgba(0, 150, 255, 0.1); color: #fff; box-shadow: none; }
        
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(0, 150, 255, 0.2); }
        .admin-tab { flex: 1; padding: 12px 10px; background: transparent; border: none; border-bottom: 2px solid transparent; color: #8fa8c8; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .admin-tab.active { color: #4db8ff; border-bottom-color: #00b4ff; }
        .admin-panel { display: none; }
        .admin-panel.active { display: block; }
        
        .admin-list { max-height: 380px; overflow-y: auto; margin-bottom: 15px; padding-right: 5px; }
        .admin-list::-webkit-scrollbar { width: 6px; }
        .admin-list::-webkit-scrollbar-thumb { background: rgba(0, 150, 255, 0.4); border-radius: 3px; }
        .order-item, .service-item { background: rgba(0, 120, 220, 0.1); border: 1px solid rgba(0, 150, 255, 0.25); border-radius: 12px; padding: 15px; margin-bottom: 12px; }
        .order-head { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid rgba(0, 150, 255, 0.15); padding-bottom: 10px; }
        .order-num { font-size: 0.75rem; color: #4db8ff; font-weight: 700; background: rgba(0, 150, 255, 0.15); padding: 3px 10px; border-radius: 20px; }
        .order-date { font-size: 0.75rem; color: #6a8099; }
        .order-line { display: flex; margin-bottom: 5px; font-size: 0.9rem; gap: 8px; }
        .order-line .lbl { color: #8fa8c8; min-width: 90px; }
        .order-line .val { color: #fff; word-break: break-word; flex: 1; }
        .order-line .val a { color: #4db8ff; text-decoration: none; }
        .admin-actions { display: flex; gap: 8px; margin-top: 10px; }
        .admin-actions button { flex: 1; padding: 9px; font-size: 0.85rem; border-radius: 10px; border: 1px solid rgba(0, 150, 255, 0.4); background: transparent; color: #8fa8c8; cursor: pointer; transition: 0.3s; }
        .admin-actions button:hover { background: rgba(0, 150, 255, 0.15); color: #fff; }
        .admin-actions .danger { border-color: rgba(255, 80, 100, 0.4); color: #ff5577; }
        .admin-actions .danger:hover { background: rgba(255, 80, 100, 0.15); border-color: #ff5577; }
        .empty-state { text-align: center; padding: 35px 20px; color: #6a8099; }
        
        footer { color: #4a5f7a; font-size: 0.85rem; text-align: center; padding: 30px 0 10px; }
        footer .accent { color: #4db8ff; font-weight: 600; }
        
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(145deg, #0f1624, #0a1020); border: 1px solid rgba(0, 200, 100, 0.5); color: #fff; padding: 15px 25px; border-radius: 12px; z-index: 2000; opacity: 0; transition: 0.4s; max-width: 90%; text-align: center; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .logo-img { width: 140px; height: 140px; }
            .admin-btn { position: static; margin-bottom: 15px; }
            .products { grid-template-columns: 1fr; }
            .btn { width: 100%; }
            .modal { padding: 25px 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="admin-btn" id="openAdminBtn">🔐 Админ-панель</button>
            <img src="logo.jpg" alt="GameWebStudio" class="logo-img">
            <h1>GameWebStudio</h1>
            <p class="subtitle">Разработка • Дизайн • Поддержка</p>
        </div>

        <div class="links">
            <a href="https://m.vk.ru/gameweb_studio" target="_blank" class="link-card">
                <div class="link-icon">📢</div><div class="link-title">Наш канал</div>
            </a>
            <a href="https://vk.ru/teh_game_web_studio" target="_blank" class="link-card">
                <div class="link-icon">🛠️</div><div class="link-title">Техподдержка</div>
            </a>
            <a href="https://m.vk.ru/topic-241557775_67604376" target="_blank" class="link-card">
                <div class="link-icon">⭐</div><div class="link-title">Отзывы</div>
            </a>
        </div>

        <h2 class="section-title">Наши <span>услуги</span></h2>
        <div class="products" id="products"></div>
        <button class="btn" id="nextBtn" disabled>Далее →</button>

        <footer>© 2026 <span class="accent">GameWebStudio</span>. Все права защищены.</footer>
    </div>

    <!-- МОДАЛКА: ЗАКАЗ -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal">
            <button class="modal-close" id="closeOrderBtn">✕</button>
            <h2>📝 Оформление заказа</h2>
            <div class="order-summary">
                <div class="row"><span class="label">Услуга:</span><span class="value" id="modalService">—</span></div>
                <div class="row"><span class="label">Цена:</span><span class="value price" id="modalPrice">—</span></div>
            </div>
            <div class="custom-note" id="customNote" style="display:none;"></div>
            <div class="form-group"><label>Ваше имя <span class="required">*</span></label><input type="text" id="userName" placeholder="Как к вам обращаться?"></div>
            <div class="form-group"><label>Ссылка на профиль ВК <span class="required">*</span></label><input type="text" id="userVk" placeholder="https://vk.com/..."><div class="form-hint">Обязательно</div></div>
            <div class="form-group"><label>Комментарий</label><textarea id="userComment" placeholder="Пожелания..."></textarea></div>
            <div class="modal-buttons">
                <button class="btn btn-cancel" id="cancelOrderBtn">Отмена</button>
                <button class="btn" id="submitOrderBtn">Оформить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА: ВХОД -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <button class="modal-close" id="closeLoginBtn">✕</button>
            <h2>🔐 Вход в админ-панель</h2>
            <div class="form-group"><label>Логин</label><input type="text" id="loginUser" placeholder="admin"></div>
            <div class="form-group"><label>Пароль</label><input type="password" id="loginPass" placeholder="Пароль"></div>
            <div class="modal-buttons">
                <button class="btn btn-cancel" id="cancelLoginBtn">Отмена</button>
                <button class="btn" id="submitLoginBtn">Войти</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА: АДМИНКА -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal wide">
            <button class="modal-close" id="closeAdminBtn">✕</button>
            <h2>👑 Админ-панель</h2>
            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="orders">📥 Заявки</button>
                <button class="admin-tab" data-tab="services">🛍 Услуги</button>
            </div>
            <div class="admin-panel active" id="panel-orders">
                <div class="admin-list" id="adminOrders"></div>
                <div class="modal-buttons"><button class="btn btn-cancel" id="clearOrdersBtn">🗑 Очистить всё</button><button class="btn" id="logoutBtn">Выйти</button></div>
            </div>
            <div class="admin-panel" id="panel-services">
                <button class="btn btn-small" id="addServiceBtn" style="width:100%; margin-bottom:15px;">➕ Добавить услугу</button>
                <div class="admin-list" id="adminServices"></div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА: РЕДАКТОР УСЛУГ -->
    <div class="modal-overlay" id="serviceModal">
        <div class="modal">
            <button class="modal-close" id="closeServiceBtn">✕</button>
            <h2 id="serviceModalTitle">Услуга</h2>
            <div class="form-group"><label>Иконка (эмодзи)</label><input type="text" id="svcIcon" placeholder="🚀" maxlength="4"></div>
            <div class="form-group"><label>Название <span class="required">*</span></label><input type="text" id="svcName"></div>
            <div class="form-group"><label>Цена <span class="required">*</span></label><input type="text" id="svcPrice"></div>
            <div class="form-group"><label>Описание</label><textarea id="svcDesc"></textarea></div>
            <div class="form-group"><label><input type="checkbox" id="svcIsCustom" style="width:auto; margin-right:8px;"> Это категория "Другое"</label></div>
            <div class="modal-buttons">
                <button class="btn btn-cancel" id="cancelServiceBtn">Отмена</button>
                <button class="btn" id="saveServiceBtn">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== НАСТРОЙКИ SUPABASE =====
        const SUPABASE_URL = "https://mgraweipqwjahaijauup.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_dirmNDnd4DlFj2SRcuC_Og_mGv1hRWj";
        
        const ADMIN_LOGIN = "admin";
        const ADMIN_PASSWORD = "aka29072012";

        const API_HEADERS = {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
        };

        let selectedProduct = null;
        let editingServiceId = null;
        let isAdminLoggedIn = sessionStorage.getItem('gws_admin') === 'true';
        let servicesCache = [];

        const productsEl = document.getElementById('products'), nextBtn = document.getElementById('nextBtn');
        const orderModal = document.getElementById('orderModal'), loginModal = document.getElementById('loginModal'), adminModal = document.getElementById('adminModal'), serviceModal = document.getElementById('serviceModal');
        const toast = document.getElementById('toast');

        function showToast(text, isError = false) {
            toast.textContent = text;
            toast.style.borderColor = isError ? 'rgba(255, 80, 100, 0.5)' : 'rgba(0, 200, 100, 0.5)';
            toast.style.boxShadow = isError ? '0 10px 40px rgba(255,80,100,0.3)' : '0 10px 40px rgba(0,200,100,0.3)';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function closeModal(el) { el.classList.remove('active'); }

        document.querySelectorAll('.modal-close, .btn-cancel').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const modal = e.target.closest('.modal-overlay');
                if (modal) modal.classList.remove('active');
            });
        });

        // ===== ЗАГРУЗКА УСЛУГ =====
        async function loadServices() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/services?select=*&order=sort_order`, { headers: API_HEADERS });
                servicesCache = await res.json();
                
                productsEl.innerHTML = servicesCache.map(s => `
                    <div class="product-card" data-id="${s.id}" data-name="${s.name}" data-price="${s.price}" data-custom="${s.is_custom}">
                        <div class="product-icon">${s.icon || '📦'}</div>
                        <div class="product-name">${s.name}</div>
                        <div class="product-price">${s.price}</div>
                        <div class="product-desc">${s.description || ''}</div>
                        ${s.is_custom ? `<div class="custom-input-wrap"><label>Опишите задачу:</label><textarea placeholder="Ваша задача..."></textarea></div>` : ''}
                    </div>
                `).join('');

                productsEl.querySelectorAll('.product-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        if (e.target.tagName === 'TEXTAREA') return;
                        productsEl.querySelectorAll('.product-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        selectedProduct = {
                            id: card.dataset.id, name: card.dataset.name, price: card.dataset.price, isCustom: card.dataset.custom === 'true'
                        };
                        const wrap = card.querySelector('.custom-input-wrap');
                        if (wrap) wrap.classList.add('active');
                        productsEl.querySelectorAll('.custom-input-wrap').forEach(w => { if (w !== wrap) w.classList.remove('active'); });
                        nextBtn.disabled = false;
                    });
                });
            } catch (err) {
                showToast('Ошибка загрузки услуг', true);
            }
        }

        // ===== ОФОРМЛЕНИЕ ЗАКАЗА =====
        nextBtn.addEventListener('click', () => {
            if (!selectedProduct) return;
            const card = productsEl.querySelector('.product-card.selected');
            if (selectedProduct.isCustom) {
                const text = card.querySelector('textarea').value.trim();
                if (!text) { showToast('Опишите задачу', true); return; }
                selectedProduct.customText = text;
            }
            document.getElementById('modalService').textContent = selectedProduct.name;
            document.getElementById('modalPrice').textContent = selectedProduct.price;
            
            const note = document.getElementById('customNote');
            if (selectedProduct.customText) { note.style.display = 'block'; note.textContent = '📝 ' + selectedProduct.customText; }
            else note.style.display = 'none';

            document.getElementById('userName').value = '';
            document.getElementById('userVk').value = '';
            document.getElementById('userComment').value = '';
            orderModal.classList.add('active');
        });

        document.getElementById('submitOrderBtn').addEventListener('click', async () => {
            const name = document.getElementById('userName').value.trim();
            const vk = document.getElementById('userVk').value.trim();
            const comment = document.getElementById('userComment').value.trim();
            if (!name || !vk) { showToast('Заполните имя и ВК', true); return; }

            const btn = document.getElementById('submitOrderBtn');
            btn.disabled = true; btn.textContent = 'Отправка...';

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
                    method: 'POST', headers: API_HEADERS,
                    body: JSON.stringify({
                        user_name: name, user_vk: vk, service_id: selectedProduct.id,
                        service_name: selectedProduct.name, service_price: selectedProduct.price,
                        custom_text: selectedProduct.customText || null, comment: comment || null
                    })
                });
                if (!res.ok) throw new Error();
                closeModal(orderModal);
                showToast('✅ Заявка оформлена!');
                selectedProduct = null;
                productsEl.querySelectorAll('.product-card').forEach(c => c.classList.remove('selected'));
                productsEl.querySelectorAll('.custom-input-wrap').forEach(w => { w.classList.remove('active'); const i = w.querySelector('textarea'); if (i) i.value = ''; });
                nextBtn.disabled = true;
            } catch (err) {
                showToast('Ошибка отправки', true);
            } finally {
                btn.disabled = false; btn.textContent = 'Оформить';
            }
        });

        // ===== АДМИНКА: ВХОД =====
        document.getElementById('openAdminBtn').addEventListener('click', () => {
            if (isAdminLoggedIn) { loadAdminData(); adminModal.classList.add('active'); }
            else { loginModal.classList.add('active'); }
        });

        document.getElementById('submitLoginBtn').addEventListener('click', () => {
            if (document.getElementById('loginUser').value === ADMIN_LOGIN && document.getElementById('loginPass').value === ADMIN_PASSWORD) {
                isAdminLoggedIn = true;
                sessionStorage.setItem('gws_admin', 'true');
                closeModal(loginModal);
                loadAdminData();
                adminModal.classList.add('active');
            } else {
                showToast('Неверный пароль', true);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            isAdminLoggedIn = false;
            sessionStorage.removeItem('gws_admin');
            closeModal(adminModal);
        });

        // Вкладки
        document.querySelectorAll('.admin-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
            });
        });

        // ===== АДМИНКА: ЗАГРУЗКА ДАННЫХ =====
        async function loadAdminData() {
            // Заявки
            const resO = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=created_at.desc`, { headers: API_HEADERS });
            const orders = await resO.json();
            const adminOrders = document.getElementById('adminOrders');
            if (orders.length === 0) adminOrders.innerHTML = `<div class="empty-state"><div style="font-size:3rem;opacity:0.5;">📭</div>Нет заявок</div>`;
            else adminOrders.innerHTML = orders.map((o, i) => `
                <div class="order-item">
                    <div class="order-head"><span class="order-num">#${orders.length-i}</span><span class="order-date">${new Date(o.created_at).toLocaleString('ru-RU')}</span></div>
                    <div class="order-line"><span class="lbl">👤 Имя:</span><span class="val">${o.user_name}</span></div>
                    <div class="order-line"><span class="lbl">🔗 ВК:</span><span class="val"><a href="${o.user_vk}" target="_blank">${o.user_vk}</a></span></div>
                    <div class="order-line"><span class="lbl">📦 Услуга:</span><span class="val">${o.service_name}</span></div>
                    <div class="order-line"><span class="lbl">💰 Цена:</span><span class="val" style="color:#4db8ff;">${o.service_price}</span></div>
                    ${o.custom_text ? `<div class="order-line"><span class="lbl">📝 Текст:</span><span class="val">${o.custom_text}</span></div>` : ''}
                    ${o.comment ? `<div class="order-line"><span class="lbl">💬 Коммент:</span><span class="val">${o.comment}</span></div>` : ''}
                    <div class="admin-actions"><button class="danger" onclick="deleteOrder(${o.id})">🗑 Удалить</button></div>
                </div>
            `).join('');

            // Услуги
            const resS = await fetch(`${SUPABASE_URL}/rest/v1/services?select=*&order=sort_order`, { headers: API_HEADERS });
            servicesCache = await resS.json();
            
            const adminServices = document.getElementById('adminServices');
            adminServices.innerHTML = servicesCache.map(s => `
                <div class="service-item">
                    <div class="order-line"><span class="lbl" style="font-size:1.5rem;">${s.icon}</span><span class="val" style="font-weight:600;font-size:1.1rem;">${s.name}</span></div>
                    <div class="order-line"><span class="lbl">Цена:</span><span class="val" style="color:#4db8ff;">${s.price}</span></div>
                    <div class="admin-actions">
                        <button onclick="editService(${s.id})">✏️ Изменить</button>
                        <button class="danger" onclick="deleteService(${s.id})">🗑 Удалить</button>
                    </div>
                </div>
            `).join('');
        }

        window.deleteOrder = async function(id) {
            if (!confirm('Удалить заявку?')) return;
            await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${id}`, { method: 'DELETE', headers: API_HEADERS });
            loadAdminData();
        };

        window.deleteService = async function(id) {
            if (!confirm('Удалить услугу?')) return;
            await fetch(`${SUPABASE_URL}/rest/v1/services?id=eq.${id}`, { method: 'DELETE', headers: API_HEADERS });
            loadAdminData(); loadServices();
        };

        // ===== РЕДАКТОР УСЛУГ =====
        document.getElementById('addServiceBtn').addEventListener('click', () => {
            editingServiceId = null;
            document.getElementById('serviceModalTitle').textContent = '➕ Новая услуга';
            document.getElementById('svcIcon').value = '';
            document.getElementById('svcName').value = '';
            document.getElementById('svcPrice').value = '';
            document.getElementById('svcDesc').value = '';
            document.getElementById('svcIsCustom').checked = false;
            serviceModal.classList.add('active');
        });

        window.editService = function(id) {
            const svc = servicesCache.find(s => s.id === id);
            if (!svc) return showToast('Услуга не найдена', true);

            editingServiceId = id;
            document.getElementById('serviceModalTitle').textContent = '✏️ Редактирование';
            document.getElementById('svcIcon').value = svc.icon || '';
            document.getElementById('svcName').value = svc.name || '';
            document.getElementById('svcPrice').value = svc.price || '';
            document.getElementById('svcDesc').value = svc.description || '';
            document.getElementById('svcIsCustom').checked = !!svc.is_custom;
            serviceModal.classList.add('active');
        };

        document.getElementById('saveServiceBtn').addEventListener('click', async () => {
            const data = {
                icon: document.getElementById('svcIcon').value.trim() || '📦',
                name: document.getElementById('svcName').value.trim(),
                price: document.getElementById('svcPrice').value.trim(),
                description: document.getElementById('svcDesc').value.trim(),
                is_custom: document.getElementById('svcIsCustom').checked
            };
            if (!data.name || !data.price) { showToast('Заполните поля', true); return; }

            const btn = document.getElementById('saveServiceBtn');
            btn.disabled = true; btn.textContent = 'Сохранение...';

            try {
                if (editingServiceId) {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/services?id=eq.${editingServiceId}`, { method: 'PATCH', headers: API_HEADERS, body: JSON.stringify(data) });
                    if (!res.ok) throw new Error();
                } else {
                    const maxSort = servicesCache.length > 0 ? Math.max(...servicesCache.map(s => s.sort_order || 0)) : 0;
                    data.sort_order = maxSort + 1;
                    
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/services`, { method: 'POST', headers: API_HEADERS, body: JSON.stringify(data) });
                    if (!res.ok) throw new Error();
                }
                closeModal(serviceModal);
                showToast('✅ Услуга сохранена');
                loadAdminData(); 
                loadServices();
            } catch (err) {
                showToast('Ошибка сохранения', true);
            } finally {
                btn.disabled = false; btn.textContent = 'Сохранить';
            }
        });

        document.getElementById('clearOrdersBtn').addEventListener('click', async () => {
            if (!confirm('Удалить ВСЕ заявки?')) return;
            await fetch(`${SUPABASE_URL}/rest/v1/orders?id=gt.0`, { method: 'DELETE', headers: API_HEADERS });
            loadAdminData();
        });

        // СТАРТ
        loadServices();
    </script>
</body>
</html>
